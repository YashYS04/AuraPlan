<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- iOS Liquid Mesh Gradient -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="80%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="liquidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4338ca" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- iOS Squircle Body -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#appleBg)" filter="url(#liquidShadow)"/>
  
  <!-- Liquid Glass Specular Shimmer -->
  <rect x="5" y="5" width="54" height="28" rx="15" fill="url(#glassReflection)"/>

  <!-- Frosted Inner Ring Border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Celebration Motif (Sparkling Star + Arch Calendar Grid) -->
  <path d="M20 25h24M20 34h24M20 43h14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Glowing Amber Sparkle Star -->
  <path d="M44 38c0-4 4-6 4-6s-4-2-4-6c0 4-4 6-4 6s4 2 4 6z" fill="#fef08a"/>
  <circle cx="44" cy="38" r="1.5" fill="#ffffff"/>
  <circle cx="23" cy="25" r="2" fill="#ffffff"/>
  <circle cx="32" cy="25" r="2" fill="#ffffff"/>
  <circle cx="41" cy="25" r="2" fill="#ffffff"/>
</svg>
